{% extends "base.html" %}
{% block content %}
  <h2>New Post</h2>
  <form method="POST" enctype="multipart/form-data">
    {{ form.hidden_tag() }}
    <p>{{ form.title.label }}<br>{{ form.title(size=64) }}</p>
    <p>{{ form.body.label }}<br>{{ form.body(rows=8, cols=60) }}</p>
    <p>{{ form.image.label }}<br>{{ form.image() }}</p>
    <p>{{ form.submit() }}</p>
  </form>
{% endblock %}
